<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贵州红色文旅地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /*左侧侧边栏*/
        .sidebar{
            width: 240px;
            background-color: #882020;
            color: white;
            padding: 20px 15px;
            overflow-y: auto;
        }
        .sidebar h2{
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .site-item{
            padding:12px 8px;
            margin: 6px 0;
            background-color: #a02828;
            border-radius: 6px;
            cursor: pointer;
        }
        .site-item:hover{
            background-color: #b83030;
        }
        /*智能路线控制面板*/
        .route-options {
            margin-top: 30px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
            color:#222;
        }
        .route-options h3 {
            margin-bottom: 12px;
            color: #882020;
        }
        .route-options label {
            display: block;
            margin: 10px 0;
            font-size: 15px;
        }
        .btn-smart-route {
            width: 100%;
            margin-top:15px;
            padding: 11px;
            background-color: #882020;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size:15px;
        }
        .btn-smart-route:hover {
            background-color: #a62828;
        }
        /*地图容器*/
        #container{
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>红色景点列表</h2>
        <div id="siteListBox"></div>

        <div class="route-options">
            <h3>智能组合路线</h3>
            <label>
                <input type="radio" name="routeMode" value="nearby" checked>
                按地理位置距离分组
            </label>
            <label>
                <input type="radio" name="routeMode" value="theme">
                按红色研学主题分组
            </label>
            <label>
                <input type="radio" name="routeMode" value="day">
                按研学天数规划路线
            </label>
            <button class="btn-smart-route" onclick="generateSmartGroupRoute()">生成智能路线</button>
        </div>
    </div>
    <div id="container"></div>

    <!--高德地图JS2.0 请填入你自己的安全密钥-->
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode:'3c2a59c147d32a70a95a3203490cd001',
        }
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=18c214ca5bc17dbfd842e5ff5fca56ca"></script>

    <script>
        //景点基础数据 名称、经纬度、简介
        const siteData = [
            {
                name:"瓮安猴场会议会址",
                lng:107.4712,
                lat:27.0863,
                desc:"猴场会议被称为伟大转折的前夜，红军长征重要会议旧址。"
            },
            {
                name:"瓮安红军渡江遗址",
                lng:107.4831,
                lat:27.0452,
                desc:"1935年红军强渡乌江，为进军遵义打开通道。"
            },
            {
                name:"荔波邓恩铭故居",
                lng:107.8921,
                lat:25.4214,
                desc:"中共一大代表邓恩铭的故乡，贵州红色革命先驱诞生地。"
            },
            {
                name:"独山深河桥抗战遗址",
                lng:107.5368,
                lat:25.8033,
                desc:"北起卢沟桥，南止深河桥，日军侵华最南端遗址。"
            },
            {
                name:"都匀西山红军烈士纪念碑",
                lng:107.5120,
                lat:26.2640,
                desc:"纪念途经都匀的红军战士，缅怀革命先烈。"
            }
        ];

        //景点介绍数据
        const introData = siteData;

        let map;
        let markerList = [];
        let polylineList = [];
        let infoWindow;

        window.onload = function(){
            //初始化地图，中心点贵阳
            map = new AMap.Map("container",{
                zoom:8,
                center:[106.63,26.65]
            });
            infoWindow = new AMap.InfoWindow({
                offset: new AMap.Pixel(0,-30)
            });
            renderSiteList();
        }

        //渲染左侧景点勾选列表
        function renderSiteList(){
            let box = document.getElementById("siteListBox");
            let html = "";
            siteData.forEach((site,index)=>{
                html += `
                <div class="site-item">
                    <label>
                        <input type="checkbox" value="${index}"> ${site.name}
                    </label>
                </div>
                `;
            })
            box.innerHTML = html;
        }

        //生成智能路线入口函数
        function generateSmartGroupRoute() {
            let checkBoxes = document.querySelectorAll('.sidebar input[type="checkbox"]:checked');
            let selectedIdx = Array.from(checkBoxes).map(cb => Number(cb.value));
            if(selectedIdx.length < 2){
                alert("请至少勾选2个景点！");
                return;
            }
            let routeMode = document.querySelector('input[name="routeMode"]:checked').value;
            drawSmartGroupRoute(selectedIdx,routeMode);
        }

        //绘制分组路线
        function drawSmartGroupRoute(selectedIdx, mode) {
            markerList.forEach(m=>m.remove());
            markerList = [];
            polylineList.forEach(p=>p.remove());
            polylineList = [];
            infoWindow.close();

            let selectedSites = selectedIdx.map(i=>siteData[i]);
            let routeGroups = [];

            if(mode === 'nearby'){
                routeGroups = groupByDistance(selectedSites);
            }else if(mode === 'theme'){
                routeGroups = groupByTheme(selectedSites);
            }else if(mode === 'day'){
                routeGroups = groupByDay(selectedSites);
            }

            //多组路线配色
            const colors = ['#ff2222','#2288ff','#22cc88','#ffaa00','#aa22ff'];

            routeGroups.forEach((group,gIdx)=>{
                group.forEach((site,idx)=>{
                    let p = [site.lng,site.lat];
                    let marker = new AMap.Marker({
                        position:p,
                        title:site.name,
                        label:{
                            content:`${gIdx+1}-${idx+1}.${site.name}`
                        },
                        map:map
                    });
                    let siteIntro = introData.find(x=>x.name===site.name);
                    let contentHtml = `<h4>${site.name}</h4><p>${siteIntro.desc}</p>`;
                    marker.on("click",()=>{
                        infoWindow.setContent(contentHtml);
                        infoWindow.open(map,p);
                    });
                    markerList.push(marker);
                });

                //组内景点连线
                for(let i=0;i<group.length-1;i++){
                    let start = [group[i].lng,group[i].lat];
                    let endPt = [group[i+1].lng,group[i+1].lat];
                    let roadLine = new AMap.Polyline({
                        path:[start,endPt],
                        strokeColor: colors[gIdx % colors.length],
                        strokeWeight:6,
                        strokeOpacity:0.8,
                        map:map
                    });
                    polylineList.push(roadLine);
                }
            })
            map.setFitView();
        }

        //算法1：经纬度距离就近分组
        function groupByDistance(sites){
            if(sites.length===0) return [];
            let groups = [];
            let used = new Set();
            //距离阈值，差值小于0.15划为同一组
            const threshold = 0.15;
            sites.forEach((site,i)=>{
                if(used.has(i)) return;
                let group = [site];
                used.add(i);
                sites.forEach((other,j)=>{
                    if(used.has(j)) return;
                    let dist = Math.sqrt(Math.pow(site.lng-other.lng,2)+Math.pow(site.lat-other.lat,2));
                    if(dist<threshold){
                        group.push(other);
                        used.add(j);
                    }
                });
                groups.push(group);
            })
            return groups;
        }

        //算法2：主题分组（当前全部景点归一条红色研学主线）
        function groupByTheme(sites){
            return [sites];
        }

        //算法3：研学天数分组，北纬大于26.5第一天路线，剩下第二天路线
        function groupByDay(sites){
            let day1 = [],day2=[];
            sites.forEach(s=>{
                if(s.lat>26.5){
                    day1.push(s);
                }else{
                    day2.push(s);
                }
            });
            let groups = [];
            if(day1.length>0) groups.push(day1);
            if(day2.length>0) groups.push(day2);
            return groups;
        }
    </script>
</body>
</html>
